<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #outer {
            /* position: relative; */
            display: flex;
            justify-content: center;
            align-items: center;
            width: 400px;
            height: 400px;
            background-color: lightgray;
            border: 2px solid black;
            border-radius: 50%;
            margin: 10px auto;

        }
        #inner {
            position: absolute;
            width: 200px;
            height: 200px;
            border: 2px solid black;
            border-radius: 50%;
            /* top: 50%;
            left: 50%;
            transform: translate(-50%, -50%); */
            background-color: white;
            z-index: 1;
            box-shadow: 0 0 10px 5px rgba(0, 0, 0, 0.5);
            
        }

    </style>
</head>
<body>
    <div id="outer">
        <div id="inner"></div>
    </div>
</body>
</html>
